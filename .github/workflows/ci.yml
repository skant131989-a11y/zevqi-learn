name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: packages/cli/package-lock.json
      - run: npm ci --prefix packages/cli
      - name: Typecheck
        run: npm run typecheck
      - name: Test (unit, CLI contract, end-to-end with mock AI and real git)
        run: npm test
      - name: The committed build matches the source
        if: runner.os == 'Linux' && matrix.node == 22
        run: |
          npm run build:cli
          git diff --exit-code -- packages/cli/dist || (echo "packages/cli/dist is out of date. Run: npm run build:cli, then commit it." && exit 1)
