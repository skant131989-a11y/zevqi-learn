name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do **not** paste source code, API keys or team keys. For security issues, email hello@zevqi.com instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. zlearn init\n2. ..."
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `zlearn doctor`
      render: text
  - type: input
    id: version
    attributes:
      label: zlearn version (`zlearn --version`)
  - type: input
    id: env
    attributes:
      label: OS, Node version and Claude Code version
